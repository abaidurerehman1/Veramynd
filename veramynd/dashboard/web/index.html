<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Veramynd — Curriculum Alignment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <a href="#/overview" class="brand" aria-label="Veramynd home">
          <svg class="logo-mark" viewBox="0 0 40 40" width="36" height="36" aria-hidden="true">
            <rect width="40" height="40" rx="10" fill="#1f6f5b"/>
            <path d="M10 11.5h4.2L20 28.5 25.8 11.5H30L21.6 31h-3.2L10 11.5z" fill="#fff"/>
            <circle cx="29.2" cy="12.2" r="2.2" fill="#b7d7cd"/>
          </svg>
          <span class="brand-name">Veramynd</span>
        </a>
        <button type="button" class="menu-btn" id="menuBtn" aria-label="Toggle navigation" title="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>

      <nav class="nav-scroll" aria-label="Main">
        <div class="nav-group">
          <div class="nav-label">Main</div>
          <a href="#/overview" data-nav="overview">Overview</a>
          <a href="#/curriculum" data-nav="curriculum">Curriculum</a>
          <a href="#/standards" data-nav="standards">Standards</a>
          <a href="#/alignments" data-nav="alignments">Alignments</a>
          <a href="#/evidence" data-nav="evidence">Evidence</a>
          <a href="#/review" data-nav="review">Review</a>
        </div>

        <div class="nav-group">
          <div class="nav-label">Operations</div>
          <a href="#/pipeline" data-nav="pipeline">Pipeline</a>
          <a href="#/ingestion" data-nav="ingestion">Ingestion</a>
          <a href="#/exports" data-nav="exports">Exports</a>
        </div>

        <div class="nav-group">
          <div class="nav-label">Account</div>
          <a href="#/settings" data-nav="settings">Settings</a>
        </div>
      </nav>

      <div class="sidebar-bottom">
        <div class="user-row">
          <div class="avatar">VR</div>
          <div class="user-meta">
            <div class="user-name">Reviewer</div>
            <div class="user-role">Curriculum specialist</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="greet">
          <button type="button" class="menu-btn top-menu" id="menuBtnTop" aria-label="Toggle navigation" title="Menu">
            <span></span><span></span><span></span>
          </button>
          <div>
            <h1 class="greet-title" id="greetTitle">Good day</h1>
            <p class="greet-sub" id="crumbs">Monitor curriculum alignment quality and review status</p>
          </div>
        </div>
        <div class="top-actions">
          <div class="search-wrap">
            <input id="globalSearch" type="search" placeholder="Search lessons, standards, evidence…" />
            <div class="search-pop" id="searchPop" hidden></div>
          </div>
          <button type="button" class="icon-btn" id="reloadBtn" title="Reload artifacts" aria-label="Reload">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-2.6-6.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M21 4v5h-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="profile-chip">
            <div class="avatar sm">VR</div>
            <div>
              <div class="user-name">Reviewer</div>
              <div class="user-role">Batch-1 pilot</div>
            </div>
          </div>
        </div>
      </header>
      <main class="page" id="page">
        <div class="skeleton-page" id="bootSkeleton">
          <div class="sk sk-title"></div>
          <div class="sk sk-row"></div>
          <div class="sk sk-row"></div>
        </div>
      </main>
    </div>
  </div>

  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <div class="drawer-panel" id="drawerPanel"></div>
  </aside>

  <script src="/assets/app.js" defer></script>
</body>
</html>
