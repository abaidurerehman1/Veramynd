name: Setup Veramynd Postgres

on:
  workflow_dispatch:
    inputs:
      db_password:
        description: "Postgres password (must match DATABASE_URL secret)"
        required: true
        type: string
      db_user:
        description: "Postgres user"
        required: false
        default: "veramynd"
        type: string
      db_name:
        description: "Postgres database name"
        required: false
        default: "veramynd"
        type: string
      host_port:
        description: "Host port to listen on"
        required: false
        default: "5433"
        type: string

jobs:
  setup:
    name: Install hosted Postgres on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install and configure Postgres
        uses: appleboy/ssh-action@v1.2.0
        env:
          DB_PASSWORD: ${{ inputs.db_password }}
          DB_USER: ${{ inputs.db_user }}
          DB_NAME: ${{ inputs.db_name }}
          HOST_PORT: ${{ inputs.host_port }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: DB_PASSWORD,DB_USER,DB_NAME,HOST_PORT
          script_stop: true
          command_timeout: 25m
          script: |
            set -euo pipefail
            APP="$HOME/apps/veramynd"
            mkdir -p "$APP/logs"

            if command -v docker >/dev/null 2>&1; then
              DOCKER=docker
            elif command -v podman >/dev/null 2>&1; then
              DOCKER=podman
            else
              DOCKER=""
            fi

            if [[ -n "$DOCKER" ]]; then
              NAME=veramynd-postgres
              $DOCKER rm -f "$NAME" 2>/dev/null || true
              $DOCKER run -d \
                --name "$NAME" \
                --restart unless-stopped \
                -e POSTGRES_USER="$DB_USER" \
                -e POSTGRES_PASSWORD="$DB_PASSWORD" \
                -e POSTGRES_DB="$DB_NAME" \
                -p "127.0.0.1:${HOST_PORT}:5432" \
                -v "$APP/postgres/data:/var/lib/postgresql/data" \
                postgres:16-alpine
              for i in $(seq 1 30); do
                if $DOCKER exec "$NAME" pg_isready -U "$DB_USER" -d "$DB_NAME" >/dev/null 2>&1; then
                  echo "Postgres docker ready"
                  break
                fi
                sleep 2
              done
              $DOCKER exec "$NAME" pg_isready -U "$DB_USER" -d "$DB_NAME"
              echo "OK: postgres via docker on 127.0.0.1:${HOST_PORT}"
              exit 0
            fi

            echo "No docker/podman — installing system PostgreSQL"
            if ! command -v psql >/dev/null 2>&1; then
              if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
                sudo apt-get update -y
                sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql postgresql-contrib
                sudo systemctl enable --now postgresql
              else
                echo "ERROR: cannot install postgres (no docker and no passwordless sudo)"
                exit 1
              fi
            fi

            # Ensure server is running
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              sudo systemctl start postgresql || true
            fi

            # Create role + database (idempotent)
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              sudo -u postgres psql -v ON_ERROR_STOP=1 <<SQL
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '${DB_USER}') THEN
                CREATE ROLE ${DB_USER} LOGIN PASSWORD '${DB_PASSWORD}';
              ELSE
                ALTER ROLE ${DB_USER} WITH LOGIN PASSWORD '${DB_PASSWORD}';
              END IF;
            END
            \$\$;
            SELECT 'CREATE DATABASE ${DB_NAME} OWNER ${DB_USER}'
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '${DB_NAME}')\gexec
            GRANT ALL PRIVILEGES ON DATABASE ${DB_NAME} TO ${DB_USER};
            SQL

              # Listen on localhost HOST_PORT via pg_hba + optional port config is complex;
              # use default 5432 and also set iptables? Prefer changing DATABASE_URL to 5432.
              # For compatibility with existing secret port 5433, add a socat/proxy if needed.
              PGPORT="$(sudo -u postgres psql -tAc 'SHOW port' | tr -d '[:space:]')"
              echo "PGPORT=${PGPORT}"

              # Local connectivity test
              PGPASSWORD="$DB_PASSWORD" psql -h 127.0.0.1 -p "$PGPORT" -U "$DB_USER" -d "$DB_NAME" -c 'SELECT 1 AS ok;'

              # If secret expects 5433 but server is 5432, start a tiny localhost forwarder
              if [[ "$HOST_PORT" != "$PGPORT" ]]; then
                if command -v socat >/dev/null 2>&1 || sudo DEBIAN_FRONTEND=noninteractive apt-get install -y socat; then
                  pkill -f "socat TCP-LISTEN:${HOST_PORT}" 2>/dev/null || true
                  nohup socat "TCP-LISTEN:${HOST_PORT},bind=127.0.0.1,reuseaddr,fork" "TCP:127.0.0.1:${PGPORT}" \
                    > "$APP/logs/pg-forward.log" 2>&1 &
                  echo $! > "$APP/pg-forward.pid"
                  sleep 1
                  PGPASSWORD="$DB_PASSWORD" psql -h 127.0.0.1 -p "$HOST_PORT" -U "$DB_USER" -d "$DB_NAME" -c 'SELECT 1 AS ok_forward;'
                  echo "OK: postgres on 127.0.0.1:${PGPORT}, forwarded to 127.0.0.1:${HOST_PORT}"
                else
                  echo "WARN: could not forward ${HOST_PORT}; use port ${PGPORT} in DATABASE_URL"
                fi
              else
                echo "OK: postgres on 127.0.0.1:${PGPORT}"
              fi
            else
              echo "ERROR: sudo required to configure system postgres"
              exit 1
            fi
