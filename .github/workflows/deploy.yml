name: Deploy Veramynd

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch or tag). Defaults to the workflow branch."
        required: false
        type: string

concurrency:
  group: deploy-veramynd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build runtime .env files (never echo values)
        env:
          # Pipeline / parser
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_EMBEDDING_MODEL: ${{ secrets.OPENAI_EMBEDDING_MODEL }}
          QDRANT_COLLECTION: ${{ secrets.QDRANT_COLLECTION }}
          QDRANT_STANDARDS_COLLECTION: ${{ secrets.QDRANT_STANDARDS_COLLECTION }}
          RERANK_MODEL: ${{ secrets.RERANK_MODEL }}
          JUDGE_MODEL: ${{ secrets.JUDGE_MODEL }}
          JUDGE_ESCALATE_MODEL: ${{ secrets.JUDGE_ESCALATE_MODEL }}
          LLM_AUTO_RAISE: ${{ secrets.LLM_AUTO_RAISE }}
          NORMALIZE_ESCALATE_MODEL: ${{ secrets.NORMALIZE_ESCALATE_MODEL }}
          # Backend auth / dashboard
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRE_HOURS: ${{ secrets.JWT_EXPIRE_HOURS }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          VERAMYND_API_PORT: ${{ secrets.VERAMYND_API_PORT }}
          VERAMYND_DOMAIN: ${{ secrets.VERAMYND_DOMAIN }}
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          out = Path("scripts/deploy")
          out.mkdir(parents=True, exist_ok=True)

          def write_env(path: Path, keys: list[str], defaults: dict[str, str] | None = None) -> None:
              defaults = defaults or {}
              lines = []
              for k in keys:
                  v = (os.environ.get(k) or defaults.get(k) or "").strip()
                  # Quote values so special chars (e.g. SMTP_FROM=<...>) are dotenv-safe
                  # and never break shell if accidentally sourced.
                  if v and any(ch in v for ch in ' \t\n#"\'\\<>$`|&;()'):
                      escaped = (
                          v.replace("\\", "\\\\")
                          .replace('"', '\\"')
                          .replace("\n", "\\n")
                      )
                      lines.append(f'{k}="{escaped}"')
                  else:
                      lines.append(f"{k}={v}")
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")
              os.chmod(path, 0o644)
              print(f"wrote {path} ({path.stat().st_size} bytes, values redacted)")

          write_env(
              out / "veramynd.env",
              [
                  "OPENAI_API_KEY", "ANTHROPIC_API_KEY", "OPENAI_MODEL",
                  "OPENAI_EMBEDDING_MODEL", "QDRANT_COLLECTION",
                  "QDRANT_STANDARDS_COLLECTION", "RERANK_MODEL", "JUDGE_MODEL",
                  "JUDGE_ESCALATE_MODEL", "LLM_AUTO_RAISE", "NORMALIZE_ESCALATE_MODEL",
              ],
              {
                  "OPENAI_MODEL": "gpt-4.1-mini",
                  "OPENAI_EMBEDDING_MODEL": "text-embedding-3-large",
                  "QDRANT_COLLECTION": "veramynd_chunks",
                  "QDRANT_STANDARDS_COLLECTION": "veramynd_standards",
                  "RERANK_MODEL": "BAAI/bge-reranker-base",
                  "JUDGE_MODEL": "claude-sonnet-4-5",
                  "JUDGE_ESCALATE_MODEL": "claude-opus-4-6",
                  "LLM_AUTO_RAISE": "1",
                  "NORMALIZE_ESCALATE_MODEL": "o4-mini",
              },
          )

          port = (os.environ.get("VERAMYND_API_PORT") or "9102").strip()
          domain = (os.environ.get("VERAMYND_DOMAIN") or "").strip().lower()
          if domain:
              public = f"https://{domain}"
              app_default = public
              api_default = public
              google_redirect = f"{public}/api/auth/oauth/google/callback"
          else:
              app_default = f"http://127.0.0.1:{port}"
              api_default = f"http://127.0.0.1:{port}"
              google_redirect = f"http://127.0.0.1:{port}/api/auth/oauth/google/callback"

          write_env(
              out / "backend.env",
              [
                  "DATABASE_URL", "JWT_SECRET", "JWT_EXPIRE_HOURS",
                  "APP_BASE_URL", "API_BASE_URL",
                  "SMTP_HOST", "SMTP_PORT", "SMTP_USER", "SMTP_PASSWORD",
                  "SMTP_FROM", "SMTP_USE_TLS",
                  "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "GOOGLE_REDIRECT_URI",
                  "VERAMYND_DOMAIN",
              ],
              {
                  "JWT_EXPIRE_HOURS": "168",
                  "SMTP_PORT": "587",
                  "SMTP_USE_TLS": "true",
                  "APP_BASE_URL": app_default,
                  "API_BASE_URL": api_default,
                  "GOOGLE_REDIRECT_URI": google_redirect,
                  "VERAMYND_DOMAIN": domain,
              },
          )

          # Pass domain to remote deploy for Caddy / tunnel selection
          (out / "public.env").write_text(
              f"VERAMYND_DOMAIN={domain}\nVERAMYND_API_PORT={port}\n",
              encoding="utf-8",
          )
          os.chmod(out / "public.env", 0o644)

          assert (out / "veramynd.env").stat().st_size > 50
          assert (out / "backend.env").is_file()
          assert (out / "remote_deploy.sh").is_file()
          PY

      - name: Upload deploy assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "scripts/deploy/remote_deploy.sh,scripts/deploy/veramynd.env,scripts/deploy/backend.env,scripts/deploy/public.env"
          target: "~/apps/veramynd/"
          strip_components: 2
          overwrite: true

      - name: Deploy over SSH (apps/veramynd only)
        uses: appleboy/ssh-action@v1.2.0
        env:
          VERAMYND_API_PORT: ${{ secrets.VERAMYND_API_PORT }}
          VERAMYND_REPO_REF: ${{ github.event.inputs.ref || github.ref_name }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: VERAMYND_API_PORT,VERAMYND_REPO_REF
          command_timeout: 60m
          script_stop: true
          script: |
            set -euo pipefail
            chmod +x "$HOME/apps/veramynd/remote_deploy.sh"
            test -f "$HOME/apps/veramynd/veramynd.env"
            test -f "$HOME/apps/veramynd/backend.env"
            export VERAMYND_REPO_REF="${VERAMYND_REPO_REF:-main}"
            export VERAMYND_API_PORT="${VERAMYND_API_PORT:-9102}"
            export VERAMYND_ENV_FILE="$HOME/apps/veramynd/veramynd.env"
            export VERAMYND_BACKEND_ENV_FILE="$HOME/apps/veramynd/backend.env"
            if [[ -f "$HOME/apps/veramynd/public.env" ]]; then
              set -a
              # shellcheck disable=SC1091
              source "$HOME/apps/veramynd/public.env"
              set +a
            fi
            echo "Deploying ref: ${VERAMYND_REPO_REF}"
            bash "$HOME/apps/veramynd/remote_deploy.sh"
