name: Deploy Veramynd

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-veramynd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build runtime .env (never echo values)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_EMBEDDING_MODEL: ${{ secrets.OPENAI_EMBEDDING_MODEL }}
          QDRANT_COLLECTION: ${{ secrets.QDRANT_COLLECTION }}
          QDRANT_STANDARDS_COLLECTION: ${{ secrets.QDRANT_STANDARDS_COLLECTION }}
          RERANK_MODEL: ${{ secrets.RERANK_MODEL }}
          JUDGE_MODEL: ${{ secrets.JUDGE_MODEL }}
          JUDGE_ESCALATE_MODEL: ${{ secrets.JUDGE_ESCALATE_MODEL }}
          LLM_AUTO_RAISE: ${{ secrets.LLM_AUTO_RAISE }}
          NORMALIZE_ESCALATE_MODEL: ${{ secrets.NORMALIZE_ESCALATE_MODEL }}
        run: |
          umask 077
          mkdir -p deploy-artifacts
          cat > deploy-artifacts/veramynd.env <<EOF
          OPENAI_API_KEY=${OPENAI_API_KEY}
          ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
          OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-mini}
          OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
          QDRANT_COLLECTION=${QDRANT_COLLECTION:-veramynd_chunks}
          QDRANT_STANDARDS_COLLECTION=${QDRANT_STANDARDS_COLLECTION:-veramynd_standards}
          RERANK_MODEL=${RERANK_MODEL:-BAAI/bge-reranker-base}
          JUDGE_MODEL=${JUDGE_MODEL:-claude-sonnet-4-5}
          JUDGE_ESCALATE_MODEL=${JUDGE_ESCALATE_MODEL:-claude-opus-4-6}
          LLM_AUTO_RAISE=${LLM_AUTO_RAISE:-1}
          NORMALIZE_ESCALATE_MODEL=${NORMALIZE_ESCALATE_MODEL:-o4-mini}
          EOF
          sed -i 's/^[[:space:]]*//' deploy-artifacts/veramynd.env
          cp scripts/deploy/remote_deploy.sh deploy-artifacts/remote_deploy.sh

      - name: Upload deploy assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "deploy-artifacts/*"
          target: "~/apps/veramynd/"
          strip_components: 1
          overwrite: true

      - name: Deploy over SSH (apps/veramynd only)
        uses: appleboy/ssh-action@v1.2.0
        env:
          VERAMYND_API_PORT: ${{ secrets.VERAMYND_API_PORT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: VERAMYND_API_PORT
          command_timeout: 60m
          script_stop: true
          script: |
            set -euo pipefail
            chmod +x "$HOME/apps/veramynd/remote_deploy.sh"
            export VERAMYND_REPO_REF=main
            export VERAMYND_API_PORT="${VERAMYND_API_PORT:-8080}"
            export VERAMYND_ENV_FILE="$HOME/apps/veramynd/veramynd.env"
            bash "$HOME/apps/veramynd/remote_deploy.sh"
